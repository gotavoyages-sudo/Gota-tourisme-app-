// ---- views ----
const TABS=[['ov','Overview'],['st','Stay'],['tr','Transport & Services'],['ac','Activities'],['it','Itinerary'],['qu','Quotation'],['vo','Vouchers'],['pa','Payments'],['pf','Internal Profit'],['wa','WhatsApp']];
function render(){const nav=$('#nav');nav.innerHTML=[['dash','Dashboard'],['trips','Trips'],['set','Settings']].map(([k,l])=>`<a class="${S.view==k||(k=='trips'&&S.view=='trip')?'on':''}" onclick="go('${k}')">${l}</a>`).join('');
$('#sub').style.display=S.view=='trip'?'flex':'none';if(S.view=='trip')$('#sub').innerHTML=TABS.map(([k,l])=>`<a class="${S.tab==k?'on':''}" onclick="S.tab='${k}';render()">${l}</a>`).join('');
$('#app').innerHTML=S.view=='dash'?vDash():S.view=='trips'?vTrips():S.view=='set'?vSet():vTrip();window.scrollTo(0,0)}
const go=v=>{S.view=v;render()};
const open_=id=>{S.cur=id;S.view='trip';S.tab='ov';render()};
function vDash(){const A=S.trips.filter(t=>!t.archived),c=s=>A.filter(t=>s.includes(t.status)).length;let rev=0,pr=0,out=0;A.filter(t=>t.status!='Cancelled').forEach(t=>{const x=tot(t);rev+=x.pay;if(!x.inc)pr+=x.ep;out+=Math.max(0,x.bal)});
const up=A.filter(t=>t.start>=iso(new Date())&&t.status!='Cancelled').sort((a,b)=>a.start>b.start?1:-1).slice(0,5),R=S.st.rate,f=x=>fF(x)+' / '+fN(x*R);
const k=(l,v)=>`<div class="card"><div class="k">${l}</div><div class="v">${v}</div></div>`;
return`<div class="grid">${k('Total trips',A.length)}${k('New enquiries',c(['New Enquiry']))}${k('Quotations in progress',c(['Quotation Preparation','Quotation Review']))}${k('Quotations sent',c(['Quotation Sent']))}${k('Pending bookings',c(['Client Accepted','Booking Pending']))}${k('Confirmed trips',c(['Booking Confirmed','Partially Paid','Fully Paid','Ready for Travel']))}</div>
<div class="grid">${k('Outstanding client payments',f(out))}${k('Estimated revenue',f(rev))}${k('Est. internal profit (complete trips only)',f(pr))}</div>
<div class="card"><b>Upcoming departures</b>${up.map(t=>`<p><a href="#" onclick="open_('${t.id}');return false">${E(t.ref)} · ${E(t.title)}</a> — ${fd(t.start)} <span class="tag">${t.status}</span></p>`).join('')||'<p>None.</p>'}</div>
<div class="warn">Data is stored in this browser only (Local Storage). It is not shared between devices or staff and has no login security — use Settings → Export for backups.</div>`}
let flt={q:'',s:'',c:''};
function vTrips(){const L=S.trips.filter(t=>(!flt.q||(t.client.name+t.ref+t.title).toLowerCase().includes(flt.q.toLowerCase()))&&(!flt.s||t.status==flt.s)&&(!flt.c||t.to.co==flt.c));
return`<div class="card"><div class="row"><div><label>Search client / reference</label><input value="${E(flt.q)}" onchange="flt.q=this.value;render()"></div><div><label>Status</label><select onchange="flt.s=this.value;render()"><option value="">All</option>${ST.map(s=>`<option ${s==flt.s?'selected':''}>${s}</option>`).join('')}</select></div><div><label>Country</label><select onchange="flt.c=this.value;render()"><option value="">All</option>${['Benin','Nigeria','Togo','Ghana'].map(s=>`<option ${s==flt.c?'selected':''}>${s}</option>`).join('')}</select></div><div><button class="g" onclick="newTrip()">+ New trip</button></div></div></div>
${L.map(t=>{const x=tot(t);return`<div class="card" style="${t.archived?'opacity:.5':''}"><b>${E(t.ref)}</b> · ${E(t.title)} <span class="tag">${t.status}</span><br><small>${E(t.client.name)||'(no client)'} · ${fd(t.start)} → ${fd(t.end)} · ${E(t.to.co)}</small><div class="tot">${fm(x.pay,t,1)}</div>
<button class="s" onclick="open_('${t.id}')">Open</button><button class="s" onclick="dup('${t.id}')">Duplicate</button><button class="s r" onclick="arch('${t.id}')">${t.archived?'Restore':'Archive / cancel'}</button></div>`}).join('')||'<div class="card">No trips found.</div>'}`}
function newTrip(){const t=nt();S.trips.unshift(t);save();open_(t.id)}
function dup(id){const o=S.trips.find(t=>t.id==id),t=JSON.parse(JSON.stringify(o));t.id='t'+Date.now();t.ref='GV-'+new Date().getFullYear()+'-'+String(S.trips.length+1).padStart(3,'0');t.status='Trip Draft';t.pays=[];t.quotes=[];t.sup=[];t.qstatus='Draft';t.title+=' (copy)';t.hist=[{d:new Date().toISOString(),x:'Duplicated from '+o.ref}];S.trips.unshift(t);save();render()}
function arch(id){const t=S.trips.find(t=>t.id==id);if(cf(t.archived?'Restore trip?':'Archive and mark this trip Cancelled?')){t.archived=!t.archived;if(t.archived){t.status='Cancelled';t.hist.push({d:new Date().toISOString(),x:'Archived/Cancelled'})}save();render()}}
function vTrip(){const t=T();if(!t)return go('trips'),'';const w=warns(t),x=tot(t),tb={ov,st:vStay,tr,ac,it:vItin,qu,vo,pa,pf,wa}[S.tab];
return`<div class="card"><b>${E(t.ref)}</b> · ${E(t.title)} <span class="tag">${t.status}</span> <span class="tag">Quote: ${t.qstatus}</span><div class="tot">${fm(x.pay,t,1)}</div>${w.length?`<div class="warn"><b>Review needed:</b><br>${w.map(E).join('<br>')}</div>`:''}</div>${tb(t,x)}`}
function ov(t){const P=pax(t);return`<div class="card"><h3>Client</h3><div class="row">${I('client.name','Client / group')}${I('client.contact','Contact person')}${I('client.phone','Telephone')}${I('client.email','Email')}</div><div class="row">${Sl('client.type','Client type',['Direct Client','Travel Agency','Corporate Client','Partner'])}${I('client.nat','Nationality')}${I('client.lang','Language')}${I('staff','Assigned staff')}</div>${I('client.req','Special requests')}${I('client.notes','Internal notes')}</div>
<div class="card"><h3>Trip</h3><div class="row">${I('title','Title')}${I('from.co','Departure country')}${I('from.city','Departure city')}${I('to.co','Destination country')}${I('to.city','Destination city')}${I('crossing','Border crossing')}</div>
<div class="row">${I('start','Start','date')}${I('end','End','date')}<div><label>Days / nights</label><input disabled value="${nd(t)} days / ${nights(t.start,t.end)} nights"></div>${Sl('status','Status',ST)}${Sl('cur','Currency display',['FCFA','NGN','Both'])}</div>
<h3>Passengers</h3><div class="row">${I('adults','Adults','number')}${I('kids','Children ages (comma-separated)')}${I('infs','Infant ages (0–1, comma-separated)')}<div><label>Total</label><input disabled value="${P.n} (${P.a} adults, ${P.k} children, ${P.i} infants)"></div></div>${I('diet','Special needs / dietary')}
<label><input type="checkbox" ${t.borderOk?'checked':''} onchange="sp('borderOk',this.checked)"> Border protocol category / nationality confirmed</label></div>
<div class="card"><h3>History</h3>${t.hist.slice(-8).reverse().map(h=>`<small>${new Date(h.d).toLocaleString()} — ${E(h.x)}</small><br>`).join('')}</div>`}
function vStay(t){const o=S.M.hotels.map(h=>`<option value="${h.id}">${E(h.co+' · '+h.name+' – '+h.room+' ('+h.rate.toLocaleString()+' '+h.cur+')')}</option>`).join('');
return`<div class="card"><label>Add from master database</label><select id="hsel"><option value="">Select hotel / room…</option>${o}</select><button class="g" onclick="addStay()">Add stay</button><button onclick="addCustom()">Add custom hotel (e.g. negotiated rate)</button></div>`+
t.stays.map((s,i)=>{const n=nights(s.cin,s.cout),inc=s.rooms*s.incl,ex=Math.max(0,s.guests-inc),p='stays.'+i+'.';
return`<div class="card"><b>${E(s.name)}</b><div class="row">${I(p+'name','Hotel')}${I(p+'room','Room category')}${I(p+'rooms','Rooms','number')}${I(p+'cin','Check-in','date')}${I(p+'cout','Check-out','date')}</div>
<div class="row">${I(p+'rate','Rate per room/night ('+s.cur+')','number')}${Sl(p+'cur','Currency',['FCFA','NGN'])}${I(p+'incl','Included breakfasts / room','number')}${I(p+'guests','Guests needing breakfast','number')}${I(p+'bfp','Extra breakfast price','number')}</div>
<div class="row">${Sl(p+'bk','Booking status',['Pending','Requested','Confirmed','Cancelled'])}${I(p+'ref','Reservation ref')}${I(p+'req','Special requests')}<div><label><input type="checkbox" ${s.fin?'checked':''} onchange="sp('${p}fin',this.checked)"> Rate is final selling price (no margin)</label></div></div>
<small>${n} nights (from dates). Included breakfasts ${inc}; extra per service: ${ex}. Included breakfasts are never re-charged.</small><br><button class="s r" onclick="del('stays',${i})">Remove</button></div>`}).join('')}
function addStay(){const h=S.M.hotels.find(x=>x.id==$('#hsel').value),t=T();if(!h)return;add('stays',{name:h.name,room:h.room,hid:h.id,rooms:1,cin:t.start,cout:t.end,rate:h.rate,cur:h.cur,bfp:h.bfp,incl:0,guests:pax(t).a+pax(t).k,fin:false,bk:'Pending',ref:'',req:''})}
function addCustom(){const t=T();add('stays',{name:'Custom hotel',room:'Room 1',hid:'',rooms:1,cin:t.start,cout:t.end,rate:0,cur:'FCFA',bfp:0,incl:0,guests:pax(t).a+pax(t).k,fin:false,bk:'Pending',ref:'',req:''})}
function tr(t){const vo=S.M.veh.map(v=>`<option value="${v.id}">${E(v.name+' ('+v.rate.toLocaleString()+' '+v.cur+')')}</option>`).join(''),so=S.M.svc.map(v=>`<option value="${v.id}">${E(v.name+' – '+v.rate.toLocaleString())}</option>`).join('');
return`<div class="card"><label><input type="checkbox" ${t.sameVeh?'checked':''} onchange="sp('sameVeh',this.checked)"> <b>Same Vehicle</b> — first vehicle covers all later lines (arrival, excursions, inter-city, departure). Rental does not automatically include fuel, tolls, driver lodging or permits: add those as extras.</label>
<select id="vsel"><option value="">Select vehicle / transfer…</option>${vo}</select><button class="g" onclick="addVeh()">Add</button><button onclick="add('trans',{name:'Custom transport',vid:'',qty:1,rate:0,cur:'FCFA',chg:false})">Custom</button></div>`+
t.trans.map((x,i)=>{const p='trans.'+i+'.';return`<div class="card"><div class="row">${I(p+'name','Service / vehicle')}${I(p+'qty','Days / trips','number')}${I(p+'rate','Rate ('+x.cur+')','number')}${Sl(p+'cur','Cur',['FCFA','NGN'])}${i>0&&t.sameVeh?`<div><label><input type="checkbox" ${x.chg?'checked':''} onchange="sp('${p}chg',this.checked)"> Charge anyway</label></div>`:''}</div><button class="s r" onclick="del('trans',${i})">Remove</button></div>`}).join('')+
`<div class="card"><h3>Guides & border protocol</h3><select id="ssel">${so}</select><button class="g" onclick="add('svc',{sid:$('#ssel').value,qty:Math.max(1,pax(T()).n)})">Add</button><br><small>Border protocol is per person per trip — quantity is not doubled for return travel. Edit quantity as needed.</small></div>`+
t.svc.map((s,i)=>{const m=S.M.svc.find(z=>z.id==s.sid);return`<div class="card"><div class="row"><div><b>${E(m?.name)}</b></div>${I('svc.'+i+'.qty','Quantity (days / persons)','number')}<div><button class="s r" onclick="del('svc',${i})">Remove</button></div></div></div>`}).join('')+
`<div class="card"><h3>Extra / operational items</h3><button onclick="add('extra',{name:'Extra item',sell:0,cur:'FCFA',fin:false})">+ Add item</button></div>`+t.extra.map((x,i)=>{const p='extra.'+i+'.';return`<div class="card"><div class="row">${I(p+'name','Description')}${I(p+'sell','Selling amount','number')}${Sl(p+'cur','Cur',['FCFA','NGN'])}<div><label><input type="checkbox" ${x.fin?'checked':''} onchange="sp('${p}fin',this.checked)"> final price (no margin)</label></div></div><button class="s r" onclick="del('extra',${i})">Remove</button></div>`}).join('')}
function addVeh(){const v=S.M.veh.find(x=>x.id==$('#vsel').value);if(v)add('trans',{name:v.name,vid:v.id,qty:1,rate:v.rate,cur:v.cur,chg:false})}
function ac(t){const P=pax(t),o=S.M.acts.map(a=>`<option value="${a.id}">${E(a.co+' · '+a.name)}</option>`).join('');
return`<div class="card"><select id="asel">${o}</select><button class="g" onclick="add('acts',{aid:$('#asel').value,day:0,mode:S.M.acts.find(z=>z.id==$('#asel').value).basis=='flat'?'flat':S.M.acts.find(z=>z.id==$('#asel').value).basis=='grp'?'grp':'pp'})">Add activity</button><br><small>Passengers: ${P.a} adults, ${P.k} children, ${P.i} infants. Prices update automatically.</small></div>`+
t.acts.map((a,i)=>{const m=S.M.acts.find(z=>z.id==a.aid),l=tot(t).L.find(z=>z.k=='a'+i);return`<div class="card"><b>${E(m.name)}</b> <small>(${m.cur})</small><div class="row"><div><label>Pricing</label><select onchange="sp('acts.${i}.mode',this.value)">${[['pp','Per person'],['grp','Fixed group package'],['flat','Flat charge']].map(([v,n])=>`<option value="${v}" ${a.mode==v?'selected':''}>${n}</option>`).join('')}</select></div>${I('acts.'+i+'.day','Itinerary day (0 = auto)','number')}${m.basis=='unk'?`<div><label><input type="checkbox" ${a.ok?'checked':''} onchange="sp('acts.${i}.ok',this.checked)"> Basis confirmed</label></div>`:''}</div>
<small>Adult ${m.a} · Child ${m.ch} · Infant ${m.inf} · Group ${m.grp}${m.dur?' · '+m.dur:''} → <b>${fi(l?.sell||0)}</b>${l?.flag?` ⚠ ${l.flag}`:''}</small><br><button class="s r" onclick="del('acts',${i})">Remove</button></div>`}).join('')}
function vItin(t){const mv=(d,i,j)=>`mvI(${d},${i},${j})`;
return`<div class="card"><button class="g" onclick="regen()">Auto-generate from trip data</button><button onclick="T().itin.push({title:'New day',items:[]});save();render()">+ Add day</button><br><small>Draft only — staff must review. Travel and border times are not verified; enter them manually.</small></div>`+
t.itin.map((d,di)=>{const h=hotelOn(t,addD(t.start,di));return`<div class="card"><div class="row"><div><b>Day ${di+1} · ${fd(addD(t.start,di))}</b></div>${I('itin.'+di+'.title','Title')}<div><button class="s r" onclick="if(cf('Remove day?')){T().itin.splice(${di},1);save();render()}">Remove day</button></div></div>
${d.items.map((x,i)=>`<div class="row" style="border-top:1px solid #eee"><div style="max-width:90px">${I(`itin.${di}.items.${i}.t`,'Time','time')}</div>${I(`itin.${di}.items.${i}.x`,'Activity / description')}${I(`itin.${di}.items.${i}.n`,'Notes')}<div style="flex:0 0 auto"><button class="s" onclick="${mv(di,i,-1)}">↑</button><button class="s" onclick="${mv(di,i,1)}">↓</button><select style="width:70px" onchange="mvD(${di},${i},+this.value)">${t.itin.map((_,k)=>`<option value="${k}" ${k==di?'selected':''}>D${k+1}</option>`).join('')}</select><button class="s r" onclick="T().itin[${di}].items.splice(${i},1);save();render()">✕</button></div></div>`).join('')}
<button class="s" onclick="T().itin[${di}].items.push({t:'',x:'New item',n:''});save();render()">+ Item</button><br><small>Overnight: ${h?E(h.name):'— none recorded'}</small></div>`}).join('')||'<div class="card">No itinerary yet — generate one.</div>'}
function mvI(d,i,k){const a=T().itin[d].items,j=i+k;if(j<0||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];save();render()}
function mvD(d,i,n){const T_=T(),x=T_.itin[d].items.splice(i,1)[0];T_.itin[n].items.push(x);save();render()}
function regen(){const t=T();if(t.itin.length&&!cf('Replace the current itinerary with a new draft? Manual edits will be lost.'))return;t.itin=gen(t);save();render()}
function quoteBody(t,x,mode){const sc=1+t.margin/100,fx=t.pkg>0;let rows='';
if(mode=='itemized'&&!fx){let sum=0;x.L.forEach(l=>{const p=l.fin?l.sell:l.sell*sc;sum+=p;rows+=`<tr><td>${E(l.cat)}</td><td>${E(l.label)}</td><td style="text-align:right">${fm(p,t)}</td></tr>`});if(t.disc)rows+=`<tr><td colspan=2>Discount</td><td style="text-align:right">−${fm(t.disc,t)}</td></tr>`;const adj=x.pay-(sum-t.disc);if(Math.abs(adj)>1)rows+=`<tr><td colspan=2>Rounding adjustment</td><td style="text-align:right">${fm(adj,t)}</td></tr>`;rows=`<table><tr><th>Type</th><th>Description</th><th style="text-align:right">Price</th></tr>${rows}</table>`}
else if(mode!='noprice')rows=`<p>Package price (all inclusions below)${t.disc?` after discount of ${fm(t.disc,t)}`:''}</p>`;
return`<h2>${E(t.title)}</h2><p><b>Client:</b> ${E(t.client.name)} · <b>Destination:</b> ${E(t.to.city)}, ${E(t.to.co)} · <b>Dates:</b> ${fd(t.start)} – ${fd(t.end)} (${nd(t)} days / ${nights(t.start,t.end)} nights) · <b>Passengers:</b> ${pax(t).n} (${pax(t).a} adults, ${pax(t).k} children, ${pax(t).i} infants)</p>
<h3>Inclusions</h3><ul>${t.stays.map(s=>`<li>Accommodation: ${E(s.name)} – ${E(s.room)}, ${s.rooms} room(s), ${nights(s.cin,s.cout)} nights${s.incl?`, ${s.incl} breakfast(s) per room included`:''}</li>`).join('')}${t.trans.map(s=>`<li>Transport: ${E(s.name)}</li>`).join('')}${t.acts.map(a=>`<li>${E(S.M.acts.find(z=>z.id==a.aid)?.name)}</li>`).join('')}${t.svc.map(a=>`<li>${E(S.M.svc.find(z=>z.id==a.sid)?.name)}</li>`).join('')}</ul>
<h3>Exclusions</h3><p>${E(S.st.excl)}</p>${rows}${mode!='noprice'?`<p style="font-size:22px"><b style="color:#b08d1a">Total: ${fm(x.pay,t,1)}</b></p>`:''}
<p><b>Payment terms:</b> ${E(t.terms||S.st.terms)}<br><b>Validity:</b> ${S.st.valid} days from issue. <b>Exchange rate:</b> 1,000 FCFA = ₦${(t.rate*1000).toLocaleString()}.<br><small>${E(S.st.cond)}</small></p>`}
function qu(t,x){const m=t.qmode||'package';return`<div class="card np"><div class="row">${Sl('qmode','Quotation type',['package','itemized','noprice']).replace('<select','<select title="package / itemized / noprice"')}${Sl('qstatus','Quotation status',['Draft','Ready for review','Sent to client','Accepted','Rejected','Expired','Revised','Cancelled'])}${I('margin','GOTA margin % (stored on trip)','number','step="0.5" max="100"')}<div><label>Slider</label><input type="range" min="0" max="40" step="0.5" value="${t.margin}" onchange="sp('margin',+this.value)"></div></div>
<div class="row">${I('pkg','Manual final package price in FCFA (0 = cost-plus-margin)','number')}${I('disc','Approved discount (FCFA)','number')}${I('rate','Exchange rate: NGN per 1 FCFA','number','step="0.01"')}${I('terms','Payment terms for this trip')}</div>
<div class="warn">Method: <b>${t.pkg>0?'Manually approved final package price (no margin applied)':'Base cost + margin ('+t.margin+'%); lines marked final price get no margin'}</b></div>
<button onclick="t_=T();t_.rate=S.st.rate;save();render()" class="s">Use current global rate (${S.st.rate})</button> <button class="g" onclick="issue()">Issue quotation snapshot</button> <button onclick="window.print()">Print / Save as PDF</button> <small>(browser print — not a generated PDF file)</small></div>
<div class="doc">${brand(t)}${quoteBody(t,x,m)}</div>
<div class="card np"><b>Issued quotations</b><br>${t.quotes.map(q=>`Rev ${q.rev} · ${new Date(q.d).toLocaleString()} · ${fm(q.pay,t,1)} ${q.pay!=x.pay?'<span class="tag">outdated – current differs</span>':'<span class="tag">current</span>'}<br>`).join('')||'None. Issuing preserves a snapshot; later changes create a new revision rather than overwriting.'}</div>`}
function issue(){const t=T(),x=tot(t);t.quotes.push({rev:t.quotes.length+1,d:new Date().toISOString(),pay:x.pay,rate:t.rate,margin:t.margin});t.qstatus=t.quotes.length>1?'Revised':'Sent to client';t.hist.push({d:new Date().toISOString(),x:'Quotation rev '+t.quotes.length+' issued'});save();render()}
function vo(t){const gc=[t.client.name].filter(Boolean).join();return`<div class="card np"><button onclick="window.print()">Print all vouchers</button> <small>Client-safe: no costs or margins.</small></div>`+(t.stays.map(s=>`<div class="doc">${brand(t)}<h2>Hotel Booking Voucher — <span style="color:${s.bk=='Confirmed'?'green':'#b08d1a'}">${s.bk.toUpperCase()}</span></h2><table><tr><td>Hotel</td><td><b>${E(s.name)}</b></td></tr><tr><td>Reference</td><td>${E(s.ref)||'— (not yet assigned)'}</td></tr><tr><td>Guest(s)</td><td>${E(gc)}</td></tr><tr><td>Check-in / out</td><td>${fd(s.cin)} → ${fd(s.cout)} (${nights(s.cin,s.cout)} nights)</td></tr><tr><td>Rooms</td><td>${s.rooms} × ${E(s.room)}</td></tr><tr><td>Occupancy</td><td>${pax(t).a} adults, ${pax(t).k} children, ${pax(t).i} infants</td></tr><tr><td>Breakfast</td><td>${s.incl} per room included${s.guests>s.rooms*s.incl?`; ${s.guests-s.rooms*s.incl} extra to be arranged`:''}</td></tr><tr><td>Special requests</td><td>${E(s.req||t.client.req)}</td></tr><tr><td>Trip contact</td><td>${E(S.st.phone)}</td></tr></table>${s.bk!='Confirmed'?'<p><i>This reservation is not yet confirmed.</i></p>':''}</div>`).join('')||'<div class="card">Add accommodation first.</div>')}
function pa(t,x){return`<div class="card"><div class="row"><div><label>Final amount payable</label><div class="v">${fi(x.pay)}</div></div><div><label>Confirmed received</label><div class="v">${fi(x.paid)}</div></div><div><label>Outstanding</label><div class="tot">${fi(x.bal)}</div></div><div><label>Status</label><div class="v">${x.paid<=0?'Unpaid':x.bal>1?'Partially paid':x.bal<-1?'Overpaid':'Fully paid'}</div></div></div>
<div class="row">${I('deposit','Deposit required (FCFA)','number')}${I('refDep','Refundable deposit held (FCFA, not an expense)','number')}</div></div>
<div class="card"><h3>Record payment</h3><div class="row"><div><label>Date</label><input type="date" id="pd" value="${iso(new Date())}"></div><div><label>Amount</label><input type="number" min="0" id="pm"></div><div><label>Currency</label><select id="pc"><option>FCFA</option><option>NGN</option></select></div><div><label>Type</label><select id="pt"><option>Deposit</option><option>Partial</option><option>Final</option><option>Refund</option></select></div><div><label>Method</label><input id="pe" placeholder="Cash / Transfer"></div><div><label>Reference</label><input id="pr"></div><div><label>Status</label><select id="ps"><option>Confirmed</option><option>Pending</option></select></div></div><button class="g" onclick="addPay()">Save payment</button></div>
${t.pays.map((p,i)=>`<div class="card"><b>${fd(p.d)}</b> · ${p.type} · ${p.amt.toLocaleString()} ${p.cur} (${fi(p.f)}) · ${E(p.m)} ${E(p.r)} <span class="tag">${p.st}</span> <button class="s" onclick="T().pays[${i}].st='Confirmed';save();render()">Mark confirmed</button><button class="s r" onclick="del('pays',${i})">Delete</button></div>`).join('')}
<div class="warn">Reminders are shown here only; nothing is sent automatically — use the WhatsApp tab. Payment-schedule suggestions: ${x.pay?`100% (${fi(x.pay)}) two weeks before travel, or 75% (${fi(x.pay*.75)}) three weeks + 25% two weeks before.`:''}</div>`}
function addPay(){const t=T(),a=+$('#pm').value;if(!(a>0))return alert('Enter a valid amount');const c=$('#pc').value;t.pays.push({d:$('#pd').value,amt:a,cur:c,f:cF(a,c,t),type:$('#pt').value,m:$('#pe').value,r:$('#pr').value,st:$('#ps').value});save();render()}
function pf(t,x){return`<div class="card np"><button onclick="window.print()">Print</button> <b>INTERNAL ONLY</b></div><div class="doc"><h2>Internal profit — ${E(t.ref)}</h2>${x.inc?'<div class="err">Incomplete: some estimated costs are missing. Profit below is NOT final.</div>':''}
<table><tr><th>Item</th><th>Selling</th><th>Est. cost</th><th>Actual cost</th></tr>${x.L.map(l=>{const c=t.costs[l.k]||{};return`<tr><td>${E(l.label)}</td><td>${fi(l.sell)}</td><td><input type="number" min="0" style="width:100px" placeholder="${l.mc??'?'}" value="${c.e??''}" onchange="cs('${l.k}','e',this.value)"></td><td><input type="number" min="0" style="width:100px" value="${c.a??''}" onchange="cs('${l.k}','a',this.value)"></td></tr>`}).join('')}
<tr><td>Operational / other expenses</td><td></td><td colspan=2><input type="number" min="0" value="${t.costs.ops||''}" onchange="T().costs.ops=+this.value;save();render()"></td></tr></table>
<p>Base (before margin): ${fi(x.base+x.fin)}<br>Margin ${t.margin}%: ${fi(x.mA)}<br>Price before discount: ${fi(x.sub)}<br>Discount: ${fi(t.disc)}<br><b>Final payable: ${fi(x.pay)}</b><br>Estimated costs: ${fi(x.ec)}<br><b>Estimated net profit: ${x.inc?'INCOMPLETE':fi(x.ep)}</b><br>Actual costs: ${fi(x.ac)}<br><b>Actual net profit (payments received − actual costs): ${x.ainc?'INCOMPLETE (enter all actual costs)':fi(x.ap)}</b><br>Received: ${fi(x.paid)} · Outstanding: ${fi(x.bal)}<br>Refundable deposit held (excluded from costs): ${fi(t.refDep)}</p></div>`}
function cs(k,f,v){const t=T();t.costs[k]=t.costs[k]||{};t.costs[k][f]=v===''?'':Math.max(0,+v);save();render()}
function wa(t,x){const k=t.waK||'Initial Package Proposal',m=msg(t,x,k);return`<div class="card">${Sl('waK','Message type',['Initial Package Proposal','Itinerary-only','Payment Reminder','Booking Confirmation'])}<pre id="wt">${E(m)}</pre><button class="g" onclick="navigator.clipboard.writeText($('#wt').textContent).then(()=>alert('Copied'))">Copy message</button><button onclick="window.open('https://wa.me/?text='+encodeURIComponent($('#wt').textContent))">Open WhatsApp</button><br><small>Nothing is sent automatically.</small></div>`}
function msg(t,x,k){const d=`🌍 *GOTA Voyages* – Expert through Experience\n*${t.title}*\n📅 ${fd(t.start)} – ${fd(t.end)} (${nd(t)}D/${nights(t.start,t.end)}N)\n👥 ${pax(t).n} pax\n`;
const it=t.itin.map((y,i)=>`*Day ${i+1}: ${y.title}*\n`+y.items.map(z=>`• ${z.t?z.t+' ':''}${z.x}`).join('\n')+(hotelOn(t,addD(t.start,i))?`\n🏨 ${hotelOn(t,addD(t.start,i)).name}`:'')).join('\n\n');
if(k=='Itinerary-only')return d+'\n'+it;
if(k=='Payment Reminder')return`Hello ${t.client.name} 👋\nReminder for trip ${t.ref}:\nAmount payable: ${fm(x.pay,t,1)}\nReceived: ${fm(x.paid,t)}\nBalance: ${fm(x.bal,t,1)}\nDeadline: ${t.terms||S.st.terms}\nThank you! 🙏`;
if(k=='Booking Confirmation'){const c=t.stays.filter(s=>s.bk=='Confirmed');return d+'\n✅ *Confirmed services*\n'+(c.map(s=>`🏨 ${s.name} – ${s.room} (ref ${s.ref||'n/a'})`).join('\n')||'No services confirmed yet.')}
return d+`🏨 ${t.stays.map(s=>s.name+' – '+s.room).join(' / ')||'Hotel TBC'}\n\n`+t.itin.map((y,i)=>`Day ${i+1}: ${y.title}`).join('\n')+`\n\n💰 *Package price: ${fm(x.pay,t,1)}*\n${S.st.terms}\nValid ${S.st.valid} days.`}
function vSet(){const s=S.st,f=(k,l,ty='text',st='')=>`<div><label>${l}</label><input type="${ty}" ${st} value="${E(s[k])}" onchange="S.st.${k}=this.type=='number'?Math.max(0,+this.value):this.value;save()"></div>`;
return`<div class="card"><h3>Company & defaults</h3><div class="row">${f('co','Company')}${f('phone','Phone')}${f('email','Email')}${f('addr','Address')}</div><div class="row">${f('mAg','Agency/Partner margin %','number')}${f('mDir','Direct margin %','number')}${f('mCorp','Corporate margin %','number')}${f('valid','Quotation validity (days)','number')}${f('rn','NGN rounding (nearest)','number')}</div>
<div class="row"><div><label>1,000 FCFA = ₦ …</label><input type="number" min="1" value="${s.rate*1000}" onchange="S.st.rate=Math.max(.001,+this.value/1000);save();render()"></div>${f('terms','Default payment terms')}</div><small>Global rate affects new trips only. Existing trips keep their own snapshot (update per trip in Quotation tab). Check: 1,000 FCFA → ${fN(1000*s.rate)}; ₦2,500 → ${fF(2500/s.rate)}. Default margins don't change existing trips.</small>
<label>Exclusions</label><textarea onchange="S.st.excl=this.value;save()">${E(s.excl)}</textarea><label>Quotation conditions</label><textarea rows="4" onchange="S.st.cond=this.value;save()">${E(s.cond)}</textarea></div>
<div class="card"><h3>Master data (JSON: hotels, vehicles, activities, guides/border)</h3><small>Edit rates, bases and classifications directly; new quotes use them, issued snapshots are unchanged.</small><textarea id="mj" rows="10" style="font-family:monospace;font-size:12px">${E(JSON.stringify(S.M,null,1))}</textarea><button class="g" onclick="saveM()">Validate & save master data</button><button class="r" onclick="if(cf('Reset master data to initial values?')){S.M=mkM();save();render()}">Reset</button></div>
<div class="card"><h3>Backup</h3><button onclick="exp()">Export JSON backup</button> <label>Import backup (asks confirmation; current data is kept as a safety copy)</label><input type="file" accept=".json" onchange="imp(this.files[0])"></div>`}
function saveM(){try{const m=JSON.parse($('#mj').value);if(!['hotels','veh','acts','svc'].every(k=>Array.isArray(m[k])))throw'Missing lists';S.M=m;save();alert('Saved')}catch(e){alert('Invalid JSON: '+e)}}
async function exp(){try{const d=window.claude&&await claude.use('downloads');if(!window.claude){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='gota-backup-'+iso(new Date())+'.json';a.click();return}if(!d)return alert('Downloads are not available in this view.');await d.save({filename:'gota-backup-'+iso(new Date())+'.json',data:JSON.stringify(S,null,1)})}catch(e){if(e&&e.code!='declined')alert('Export failed: '+(e&&e.message||e))}}
function imp(f){if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(o.v!=2||!Array.isArray(o.trips)||!o.M||!o.st)throw'Not a valid GOTA v2 backup';if(!cf(`Replace ALL current data with ${o.trips.length} trips from this backup?`))return;try{localStorage.setItem(K+'_prev',JSON.stringify(S))}catch(e){}S=o;S.view='dash';save();render()}catch(e){alert('Import failed: '+e)}};r.readAsText(f)}
load();render();
</script></body></html>
